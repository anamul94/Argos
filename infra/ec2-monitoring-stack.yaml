AWSTemplateFormatVersion: '2010-09-09'
Description: 'VPC, EC2 with Nginx, CloudWatch Monitoring, and EventBridge Webhook'

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 KeyPair to enable SSH access
  WebhookUrl:
    Type: String
    Description: URL to send alerts to
  VpcCidr:
    Type: String
    Default: '10.0.0.0/16'
    Description: CIDR block for the VPC
  SubnetCidr:
    Type: String
    Default: '10.0.1.0/24'
    Description: CIDR block for the Subnet

Mappings:
  RegionMap:
    # Amazon Linux 2023 / Ubuntu AMIs
    us-east-1:
      AMI: ami-0c7217cdde317cfec
    ap-south-1:
      AMI: ami-019715e0d74f695be # User specified Ubuntu AMI

Resources:

  # --------------------------------------------------------------------------
  # Networking
  # --------------------------------------------------------------------------
  VPC:
    Type: 'AWS::EC2::VPC'
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'

  InternetGateway:
    Type: 'AWS::EC2::InternetGateway'
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw'

  VPCGatewayAttachment:
    Type: 'AWS::EC2::VPCGatewayAttachment'
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref SubnetCidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-subnet'

  PublicRouteTable:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-rt'

  PublicRoute:
    Type: 'AWS::EC2::Route'
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # --------------------------------------------------------------------------
  # Security & IAM
  # --------------------------------------------------------------------------
  InstanceSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Allow HTTP and SSH
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sg'

  InstanceRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy"
        - "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"

  InstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      Roles:
        - !Ref InstanceRole

  # --------------------------------------------------------------------------
  # Compute
  # --------------------------------------------------------------------------
  EC2Instance:
    Type: 'AWS::EC2::Instance'
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !FindInMap [RegionMap, !Ref 'AWS::Region', AMI]
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      IamInstanceProfile: !Ref InstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Update and install dependencies via apt for Ubuntu
          apt-get update -y
          apt-get install -y nginx wget curl

          # Download and install Amazon CloudWatch Agent for Ubuntu (Debian)
          wget https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb
          dpkg -i -E ./amazon-cloudwatch-agent.deb

          # Start and enable Nginx
          systemctl start nginx
          systemctl enable nginx

          # Create CloudWatch Agent config
          cat <<EOF > /opt/aws/amazon-cloudwatch-agent/bin/config.json
          {
            "agent": {
              "metrics_collection_interval": 30
            },
            "metrics": {
              "namespace": "Custom/EC2",
              "append_dimensions": {
                "InstanceId": "${!aws:InstanceId}"
              },
              "metrics_collected": {
                "mem": {
                  "measurement": ["mem_used_percent"],
                  "metrics_collection_interval": 30
                },
                "procstat": [
                  {
                    "pattern": "nginx",
                    "measurement": ["pid_count"]
                  }
                ]
              }
            },
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/var/log/syslog",
                      "log_group_name": "/argos/ec2/web-server",
                      "log_stream_name": "{instance_id}/syslog"
                    },
                    {
                      "file_path": "/var/log/nginx/error.log",
                      "log_group_name": "/argos/ec2/web-server",
                      "log_stream_name": "{instance_id}/nginx-error"
                    },
                    {
                      "file_path": "/var/log/nginx/access.log",
                      "log_group_name": "/argos/ec2/web-server",
                      "log_stream_name": "{instance_id}/nginx-access"
                    }
                  ]
                }
              }
            }
          }
          EOF

          # Start CloudWatch Agent
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/bin/config.json

      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-web-server'

  ElasticIP:
    Type: 'AWS::EC2::EIP'
    Properties:
      InstanceId: !Ref EC2Instance
      Domain: vpc

  # --------------------------------------------------------------------------
  # Alerting & Webhook Routing (SNS -> SQS -> EventBridge -> API Dest)
  # --------------------------------------------------------------------------
  AlertTopic:
    Type: 'AWS::SNS::Topic'
    Properties:
      TopicName: !Sub '${AWS::StackName}-alerts'

  AlertQueue:
    Type: 'AWS::SQS::Queue'
    Properties:
      QueueName: !Sub '${AWS::StackName}-alert-queue'

  TopicToQueueSubscription:
    Type: 'AWS::SNS::Subscription'
    Properties:
      TopicArn: !Ref AlertTopic
      Endpoint: !GetAtt AlertQueue.Arn
      Protocol: sqs

  AlertQueuePolicy:
    Type: 'AWS::SQS::QueuePolicy'
    Properties:
      Queues:
        - !Ref AlertQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: 'sqs:SendMessage'
            Resource: !GetAtt AlertQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref AlertTopic

  WebhookConnection:
    Type: 'AWS::Events::Connection'
    Properties:
      Name: !Sub '${AWS::StackName}-webhook-conn'
      AuthorizationType: API_KEY
      AuthParameters:
        ApiKeyAuthParameters:
          ApiKeyName: x-api-key
          ApiKeyValue: "dummy-key-update-me"

  WebhookDestination:
    Type: 'AWS::Events::ApiDestination'
    Properties:
      Name: !Sub '${AWS::StackName}-webhook-dest'
      ConnectionArn: !GetAtt WebhookConnection.Arn
      HttpMethod: POST
      InvocationEndpoint: !Ref WebhookUrl

  EventBridgeRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: InvokeApiDestination
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'events:InvokeApiDestination'
                Resource: !GetAtt WebhookDestination.Arn

  AlertRule:
    Type: 'AWS::Events::Rule'
    Properties:
      Name: !Sub '${AWS::StackName}-forward-alert'
      EventPattern:
        source:
          - "aws.cloudwatch"
        detail-type:
          - "CloudWatch Alarm State Change"
        detail:
          state:
            value:
              - "ALARM"
      State: ENABLED
      Targets:
        - Id: 'WebhookTarget'
          Arn: !GetAtt WebhookDestination.Arn
          RoleArn: !GetAtt EventBridgeRole.Arn
          InputTransformer:
            InputPathsMap:
              account: "$.account"
              detail: "$.detail"
              detail-type: "$.detail-type"
              id: "$.id"
              region: "$.region"
              resources: "$.resources"
              source: "$.source"
              time: "$.time"
              version: "$.version"
            InputTemplate: |
              {
                "version": <version>,
                "id": <id>,
                "detail-type": <detail-type>,
                "source": <source>,
                "account": <account>,
                "time": <time>,
                "region": <region>,
                "resources": <resources>,
                "detail": <detail>,
                "customMetadata": {
                  "LogGroup": "/argos/ec2/web-server"
                }
              }

  # --------------------------------------------------------------------------
  # CloudWatch Alarms & Logs
  # --------------------------------------------------------------------------
  EC2LogGroup:
    Type: 'AWS::Logs::LogGroup'
    Properties:
      LogGroupName: "/argos/ec2/web-server"
      RetentionInDays: 14

  CpuAlarm:
    Type: 'AWS::CloudWatch::Alarm'
    Properties:
      AlarmName: !Sub 'p3-ec2-${AWS::StackName}-cpu-high'
      AlarmDescription: "CPU Utilization > 80% for 5 minutes"
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref EC2Instance
      AlarmActions:
        - !Ref AlertTopic

  MemoryAlarm:
    Type: 'AWS::CloudWatch::Alarm'
    Properties:
      AlarmName: !Sub 'p3-ec2-${AWS::StackName}-mem-high'
      AlarmDescription: "Memory Utilization > 80% for 5 minutes"
      MetricName: mem_used_percent
      Namespace: Custom/EC2
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref EC2Instance
      AlarmActions:
        - !Ref AlertTopic

  NginxProcessAlarm:
    Type: 'AWS::CloudWatch::Alarm'
    Properties:
      AlarmName: !Sub 'p1-ec2-${AWS::StackName}-nginx-down'
      AlarmDescription: "Nginx process count < 1"
      MetricName: pid_count
      Namespace: Custom/EC2
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: LessThanOrEqualToThreshold
      TreatMissingData: breaching
      Dimensions:
        - Name: InstanceId
          Value: !Ref EC2Instance
        - Name: pattern
          Value: "nginx"
      AlarmActions:
        - !Ref AlertTopic

  InstanceStatusAlarm:
    Type: 'AWS::CloudWatch::Alarm'
    Properties:
      AlarmName: !Sub 'p1-ec2-${AWS::StackName}-instance-down'
      AlarmDescription: "EC2 Instance Status Check Failed"
      MetricName: StatusCheckFailed
      Namespace: AWS/EC2
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      Dimensions:
        - Name: InstanceId
          Value: !Ref EC2Instance
      AlarmActions:
        - !Ref AlertTopic

Outputs:
  InstancePublicIP:
    Description: Public IP of the EC2 Instance
    Value: !Ref ElasticIP
  WebhookApiDestination:
    Description: ARN of the EventBridge API Destination
    Value: !GetAtt WebhookDestination.Arn
